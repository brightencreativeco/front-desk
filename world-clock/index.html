<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  /* ---------- COLORS (set with the gear; these are the defaults) ---------- */
  :root {
    --bg: #3D452F;
    --text: #FFFAF8;
    --soft: rgba(255, 250, 248, 0.78);
    --line: rgba(255, 250, 248, 0.18);
    --hover: rgba(255, 250, 248, 0.10);
    --work: #8CCB7E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    color: var(--text);
    font-family: "DM Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 10px;
    overflow: hidden;
  }

  /* ---------- LAYOUT ----------
     Default: home time on top, city tiles below, slider at the bottom.
     Wide + short embeds: home on the left, tiles on the right. */
  .wrap {
    height: 100%;
    display: grid;
    grid-template-areas: "home" "tiles" "slider";
    grid-template-rows: minmax(0, 1.1fr) minmax(0, 2fr) auto;
    gap: 8px;
  }
  @media (min-width: 640px) and (min-aspect-ratio: 9/4) {
    .wrap {
      grid-template-areas: "home tiles" "slider slider";
      grid-template-columns: minmax(180px, 1fr) 2fr;
      grid-template-rows: minmax(0, 1fr) auto;
    }
  }
  .no-slider .wrap { grid-template-rows: minmax(0, 1.1fr) minmax(0, 2fr); }
  @media (min-width: 640px) and (min-aspect-ratio: 9/4) { .no-slider .wrap { grid-template-rows: minmax(0, 1fr); } }

  /* ---------- HOME ---------- */
  .home {
    grid-area: home;
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 12px; min-height: 0; text-align: center;
  }
  .home-city { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
  .home-time {
    font-weight: 500; line-height: 1.05; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
    font-size: clamp(26px, min(11vw, 13vh), 64px);
  }
  .home-date { font-size: 14px; color: var(--soft); }
  .ampm { font-size: .42em; color: var(--soft); margin-left: .15em; letter-spacing: 0; }

  /* ---------- CITY TILES ---------- */
  .tiles {
    grid-area: tiles;
    display: grid;
    gap: 8px;
    min-height: 0;
  }
  .tile {
    position: relative;
    background: var(--hover);
    border-radius: 10px;
    padding: 8px 10px;
    display: flex; flex-direction: column; justify-content: center;
    min-height: 0; min-width: 0; overflow: hidden;
    transition: transform .15s, background-color .15s;
  }
  .tile:hover { transform: translateY(-1px); background: var(--line); }
  .tile-city {
    font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 14px;
  }
  .tile-time {
    font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap;
    font-size: clamp(17px, min(5.5vw, 6.5vh), 30px);
  }
  .tile-note { font-size: 13px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot {
    position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--line); transition: background-color .2s;
  }
  .dot.on { background: var(--work); box-shadow: 0 0 0 3px rgba(140, 203, 126, .2); }
  .no-dot .dot { display: none; }
  .no-dot .tile-city { padding-right: 0; }

  /* ---------- SLIDER ---------- */
  .slider { grid-area: slider; display: flex; align-items: center; gap: 10px; }
  .no-slider .slider { display: none; }
  .now {
    font: 500 13px/1 "DM Sans", sans-serif; color: var(--text); background: none; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; white-space: nowrap;
    transition: transform .15s, background-color .15s, opacity .15s;
  }
  .now:hover { transform: translateY(-1px); background: var(--hover); }
  .now:disabled { opacity: .4; transform: none; background: none; cursor: default; }
  .slide-note { font-size: 13px; color: var(--soft); min-width: 74px; text-align: right; white-space: nowrap; }
  input[type=range] {
    flex: 1; min-width: 0; -webkit-appearance: none; appearance: none; background: transparent; height: 24px; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: var(--line); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--line); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%;
    background: var(--text); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--soft);
    transition: transform .15s;
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%; background: var(--text); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--soft);
  }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.15); }
  input[type=range]:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px; }

  /* gear sits in the home box's top-left corner (Notion's menu covers the top-right) */
  .city-row { display: grid; grid-template-columns: 1fr 1.3fr auto auto; gap: 4px; margin-bottom: 6px; }
  /* city search dropdown (in the settings panel) */
  .zsearch { position: relative; margin-bottom: 8px; }
  .zsearch .txt { width: 100%; }
  .sugg {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20;
    background: #fff; border: 1px solid rgba(43,47,34,.18); border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,.12); padding: 4px; max-height: 240px; overflow-y: auto;
  }
  .sugg-item {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px; width: 100%;
    font: 13px "DM Sans", sans-serif; color: #2B2F22; background: none; border: 0; border-radius: 6px;
    padding: 7px 8px; cursor: pointer; text-align: left;
  }
  .sugg-item small { color: #6B6F62; font-size: 12px; white-space: nowrap; }
  .sugg-item:hover, .sugg-item.on { background: rgba(43,47,34,.08); }
  .sugg-empty { font-size: 12px; color: #6B6F62; padding: 7px 8px; }
  .city-row { display: grid; grid-template-columns: 1fr auto auto; gap: 4px; align-items: center; margin-bottom: 6px; }
  .city-main { display: flex; flex-direction: column; min-width: 0; }
  .city-main .name-in { border-color: transparent; background: transparent; padding: 3px 6px; font-weight: 500; }
  .city-main .name-in:hover { border-color: rgba(43,47,34,.2); background: #fff; }
  .city-main .name-in:focus { background: #fff; }
  .city-main small { font-size: 12px; color: #6B6F62; padding-left: 7px; }
  .linkish { font: inherit; color: #3D452F; background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; }
  /* ---------- SETTINGS (gear + panel) ----------
     The panel always uses its own fixed colors so it stays readable
     no matter what colors someone picks for the widget. */
  .gear {
    position: fixed; top: 6px; right: 6px; z-index: 5;
    width: 28px; height: 28px; display: grid; place-items: center;
    background: none; border: 0; border-radius: 50%; cursor: pointer;
    color: var(--text); opacity: .35;
    transition: opacity .15s, transform .3s, background-color .15s;
  }
  .gear:hover, .gear:focus-visible { opacity: 1; transform: rotate(40deg); background: var(--line); }
  .gear svg { width: 16px; height: 16px; }
  .panel {
    position: fixed; inset: 0; z-index: 10; overflow-y: auto;
    background: #FFFAF8; color: #2B2F22;
    font: 13px/1.4 "DM Sans", system-ui, sans-serif; letter-spacing: 0;
    padding: 12px 16px 16px;
    -webkit-font-smoothing: antialiased;
  }
  .panel-in { max-width: 420px; margin: 0 auto; }
  .ph { display: flex; flex-direction: row-reverse; justify-content: flex-end; align-items: center; gap: 6px; margin-bottom: 6px; }  /* X on the left: Notion's menu covers the top-right */
  .ph .x { margin-left: -6px; }
  .ph span { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #6B6F62; }
  .x { background: none; border: 0; font-size: 20px; line-height: 1; color: #2B2F22; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; }
  .x:hover { background: rgba(43,47,34,.08); }
  .sec { padding: 10px 0; border-top: 1px solid rgba(43,47,34,.12); }
  .sl { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #6B6F62; margin-bottom: 8px; }
  .seg { display: flex; gap: 3px; padding: 3px; background: rgba(43,47,34,.07); border-radius: 999px; margin-bottom: 8px; }
  .seg button {
    flex: 1; font: 500 12px/1 "DM Sans", sans-serif; color: #4A4E40; background: none;
    border: 0; border-radius: 999px; padding: 7px 8px; cursor: pointer; transition: background-color .15s;
  }
  .seg button:hover { background: rgba(43,47,34,.08); }
  .seg button.on { background: #3D452F; color: #FFFAF8; }
  .crow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
  .pick { display: flex; align-items: center; gap: 6px; }
  .pick input[type=color] {
    width: 30px; height: 30px; padding: 0; border: 1px solid rgba(43,47,34,.2);
    border-radius: 50%; overflow: hidden; cursor: pointer; background: none;
  }
  .pick input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .pick input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; }
  .pick input[type=color]::-moz-color-swatch { border: 0; border-radius: 50%; }
  .hexin {
    width: 82px; font: 12px "DM Mono", ui-monospace, monospace; text-transform: uppercase;
    color: #2B2F22; background: #fff; border: 1px solid rgba(43,47,34,.2); border-radius: 6px; padding: 6px 8px;
  }
  .contrast { font-size: 12px; padding: 7px 10px; border-radius: 8px; margin-top: 4px; }
  .contrast.good { background: #E7EEDD; color: #2F4A1C; }
  .contrast.bad { background: #FBE6DA; color: #7A2E0E; }
  .tog { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; cursor: pointer; }
  .tog input { position: absolute; opacity: 0; pointer-events: none; }
  .tog i {
    width: 34px; height: 20px; border-radius: 999px; background: rgba(43,47,34,.2);
    position: relative; transition: background-color .15s; flex: none;
  }
  .tog i::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: transform .15s;
  }
  .tog input:checked + i { background: #3D452F; }
  .tog input:checked + i::after { transform: translateX(14px); }
  .tog input:focus-visible + i { outline: 2px solid #3D452F; outline-offset: 2px; }
  .resetall {
    margin-top: 10px; width: 100%; font: 500 12px/1 "DM Sans", sans-serif; color: #4A4E40;
    background: none; border: 1px solid rgba(43,47,34,.2); border-radius: 999px; padding: 8px; cursor: pointer;
    transition: background-color .15s;
  }
  .resetall:hover { background: rgba(43,47,34,.06); }
  .saved { font-size: 11px; color: #6B6F62; text-align: center; margin-top: 8px; }
  .credit { margin-top: 2px; }
  .credit a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .credit a:hover { color: #3D452F; }
  .txt {
    font: 13px "DM Sans", system-ui, sans-serif; color: #2B2F22; background: #fff;
    border: 1px solid rgba(43,47,34,.2); border-radius: 6px; padding: 6px 8px; min-width: 0;
  }
  .txt:focus { outline: 2px solid #3D452F; outline-offset: 0; }
  .mini {
    font: 500 13px/1 "DM Sans", sans-serif; color: #4A4E40; background: none; cursor: pointer;
    border: 1px solid rgba(43,47,34,.2); border-radius: 6px; padding: 6px 8px; transition: background-color .15s;
  }
  .mini:hover { background: rgba(43,47,34,.07); }
  .mini:disabled { opacity: .35; cursor: default; }
  .hint { font-size: 12px; color: #6B6F62; margin-top: 6px; }
  .gear { top: 14px; left: 14px; }
  /* screen-reader-only text: read aloud, never shown */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<button class="gear" id="gear" aria-label="Settings" aria-controls="panel" aria-expanded="false" title="Settings">
  <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" hidden>
 <div class="panel-in">
  <div class="ph"><span id="panelTitle">Settings</span><button class="x" id="closePanel" aria-label="Close settings">×</button></div>
  <div class="sec">
    <p class="sl">Colors</p>
    <div class="seg" id="themeSeg">
      <button data-v="dark">Dark</button><button data-v="light">Light</button><button data-v="custom">Custom</button>
    </div>
    <div id="customBox" hidden>
      <div class="crow"><span>Background</span><span class="pick"><input type="color" id="cBg" aria-label="Background color"><input class="hexin" id="hBg" maxlength="7" aria-label="Background hex code"></span></div>
      <div class="crow"><span>Text</span><span class="pick"><input type="color" id="cText" aria-label="Text color"><input class="hexin" id="hText" maxlength="7" aria-label="Text hex code"></span></div>
      <p class="contrast" id="contrast"></p>
    </div>
  </div>
  <div class="sec">
    <p class="sl">Home</p>
    <div class="zsearch"><input class="txt" id="homeSearch" placeholder="Search a city, state, or country…" autocomplete="off" aria-label="Search for your home city"><div class="sugg" id="homeSugg" hidden></div></div>
    <p class="hint"><span id="homeNow"></span> <button class="linkish" id="homeDevice" hidden>Use this device instead</button></p>
    <div class="crow"><span>Display name</span><input class="txt" id="homeLabel" placeholder="Auto" aria-label="Display name for your home city"></div>
  </div>
  <div class="sec">
    <p class="sl">Cities (up to 6)</p>
    <div class="zsearch"><input class="txt" id="citySearch" placeholder="+ Add a city: start typing…" autocomplete="off" aria-label="Search for a city to add"><div class="sugg" id="citySugg" hidden></div></div>
    <div id="cityRows"></div>
    <p class="hint">Click a city's name to rename it. Use ↑ to reorder.</p>
  </div>
  <div class="sec">
    <p class="sl">Display</p>
    <div class="seg" id="hourSeg"><button data-v="12">12-hour</button><button data-v="24">24-hour</button></div>
    <label class="tog"><span>Work-hours dot (9–5)</span><input type="checkbox" id="optDot"><i></i></label>
    <label class="tog"><span>Time slider</span><input type="checkbox" id="optSlider"><i></i></label>
  </div>
  <button class="resetall" id="resetAll">Reset to default</button>
  <p class="saved">Saves automatically on this device.</p>
  <p class="saved credit"><a href="https://brightencreativeco.com" target="_blank" rel="noopener">Front Desk widgets · © 2026 Brighten Creative Co.</a></p>
 </div>
</div>
<main class="wrap" id="wrap">
  <h1 class="sr-only">World Clock</h1>
  <p class="sr-only" id="live" role="status" aria-live="polite"></p>
  <section class="home" id="home">
    <p class="home-city" id="homeCity">Home</p>
    <p class="home-time" id="homeTime">--:--</p>
    <p class="home-date" id="homeDate">&nbsp;</p>
  </section>

  <section class="tiles" id="tiles"></section>

  <div class="slider" id="sliderRow">
    <button class="now" id="nowBtn" title="Back to the current time">↺ Now</button>
    <input type="range" id="slide" min="-96" max="96" step="1" value="0" aria-label="Slide to see a different time">
    <span class="slide-note" id="slideNote">Live</span>
  </div>
</main>

<script>
var SOFT = 0.78, LINE = 0.18, COLOR_KEY = "clockin-colors-world";
/* =========================================================
   SETTINGS: colors + panel
   Saved in this browser (localStorage). Each widget keeps
   its own colors (COLOR_KEY is set per widget).
   ========================================================= */
var THEMES = { dark: { bg: "#3D452F", text: "#FFFAF8" }, light: { bg: "#FFFAF8", text: "#3D452F" } };
var COLOR_DEFAULT = { theme: "dark", bg: "#3D452F", text: "#FFFAF8" };
function loadSet(key, def) {
  try { return Object.assign({}, def, JSON.parse(localStorage.getItem(key) || "{}")); }
  catch (e) { return Object.assign({}, def); }
}
function saveSet(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
var colors = loadSet(COLOR_KEY, COLOR_DEFAULT);

/* --- color math --- */
function rgbOf(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function lum(rgb) {
  var c = rgb.map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function ratio(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function mix(a, b, t) { return a.map(function (v, i) { return Math.round(v * t + b[i] * (1 - t)); }); }

function currentColors() { return colors.theme === "custom" ? colors : THEMES[colors.theme] || THEMES.dark; }
function applyColors() {
  var c = currentColors(), rgb = rgbOf(c.text).join(","), r = document.documentElement.style;
  r.setProperty("--bg", c.bg);
  r.setProperty("--text", c.text);
  r.setProperty("--soft", "rgba(" + rgb + "," + SOFT + ")");
  r.setProperty("--line", "rgba(" + rgb + "," + LINE + ")");
  r.setProperty("--hover", "rgba(" + rgb + ",0.10)");
}
/* Main text needs 4.5:1, the softer label text needs 3:1 (WCAG guidelines) */
function checkContrast() {
  var c = currentColors(), bg = rgbOf(c.bg), tx = rgbOf(c.text);
  var ok = ratio(tx, bg) >= 4.5 && ratio(mix(tx, bg, SOFT), bg) >= 3;
  var el = document.getElementById("contrast");
  el.className = "contrast " + (ok ? "good" : "bad");
  el.textContent = ok ? "✓ Easy to read" : "Hard to read. Try more difference between light and dark.";
}

/* --- panel wiring --- */
var panel = document.getElementById("panel");
/* ---------- screen readers: announce changes and handle the settings panel ---------- */
function announce(msg) { var l = document.getElementById("live"); l.textContent = ""; setTimeout(function () { l.textContent = msg; }, 50); }
var gearBtn = document.getElementById("gear");
function openPanel() { panel.hidden = false; syncPanel(); gearBtn.setAttribute("aria-expanded", "true"); document.getElementById("closePanel").focus(); }
function closePanel() { if (panel.hidden) return; panel.hidden = true; gearBtn.setAttribute("aria-expanded", "false"); gearBtn.focus(); }
gearBtn.onclick = openPanel;
document.getElementById("closePanel").onclick = closePanel;
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !panel.hidden) { closePanel(); e.stopImmediatePropagation(); } });

function segSelect(id, val) {
  document.querySelectorAll("#" + id + " button").forEach(function (b) { b.classList.toggle("on", b.dataset.v === val); });
}
function syncPanel() {
  var c = currentColors();
  segSelect("themeSeg", colors.theme);
  document.getElementById("customBox").hidden = colors.theme !== "custom";
  document.getElementById("cBg").value = c.bg; document.getElementById("hBg").value = c.bg.toUpperCase();
  document.getElementById("cText").value = c.text; document.getElementById("hText").value = c.text.toUpperCase();
  checkContrast();
  if (window.syncExtra) syncExtra();
}
document.querySelectorAll("#themeSeg button").forEach(function (b) {
  b.onclick = function () {
    if (b.dataset.v === "custom" && colors.theme !== "custom") {
      var c = currentColors(); colors.bg = c.bg; colors.text = c.text;   // start custom from what's showing
    }
    colors.theme = b.dataset.v; saveSet(COLOR_KEY, colors); applyColors(); syncPanel();
  };
});
function setColor(which, val) {
  val = val.trim(); if (val[0] !== "#") val = "#" + val;
  if (!/^#[0-9a-fA-F]{6}$/.test(val)) return;
  colors[which] = val.toLowerCase(); saveSet(COLOR_KEY, colors); applyColors(); syncPanel();
}
document.getElementById("cBg").oninput = function () { setColor("bg", this.value); };
document.getElementById("cText").oninput = function () { setColor("text", this.value); };
document.getElementById("hBg").onchange = function () { setColor("bg", this.value); };

/* =========================================================
   WORLD CLOCK SETTINGS - saved on this device
   ========================================================= */

  homeTz: "", homeLabel: "",            // blank = follow this device
  cities: [
    { label: "New York", tz: "America/New_York" },
    { label: "Los Angeles", tz: "America/Los_Angeles" },
    { label: "London", tz: "Europe/London" },
    { label: "Sydney", tz: "Australia/Sydney" }
  ],
  hours: "12", dot: true, slider: true
};

/* ---------- time zone helpers ---------- */
var DEVICE_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
function cityOf(tz) { return tz.split("/").pop().replace(/_/g, " "); }
function homeTz() { return wopts.homeTz || DEVICE_TZ; }
function homeLabel() { return wopts.homeLabel || cityOf(homeTz()); }

/* Minutes a zone is ahead of UTC at a given moment (handles daylight saving) */
function offsetMin(tz, date) {
  var p = {};
  new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric" })
    .formatToParts(date).forEach(function (x) { p[x.type] = x.value; });
  var asUTC = Date.UTC(+p.year, p.month - 1, +p.day, +p.hour % 24, +p.minute);
  return Math.round((asUTC - Math.floor(date.getTime() / 60000) * 60000) / 60000);
}
function hourIn(tz, date) {
  return +new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", hour: "numeric" }).format(date) % 24;
}
function dayKey(tz, date) {
  return new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(date);
}
function timeHTML(tz, date) {
  if (wopts.hours === "24") {
    return new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit" }).format(date);
  }
  var parts = new Intl.DateTimeFormat("en-US", { timeZone: tz, hour: "numeric", minute: "2-digit", hour12: true }).formatToParts(date);
  var main = "", ap = "";
  parts.forEach(function (x) { if (x.type === "dayPeriod") ap = x.value; else if (x.type !== "literal" || x.value.trim()) main += x.value; });
  return main + '<span class="ampm">' + ap + "</span>";
}
function diffText(mins) {
  if (mins === 0) return "Same time";
  var sign = mins > 0 ? "+" : "−", m = Math.abs(mins), h = Math.floor(m / 60), r = m % 60;
  return sign + (h ? h + (r ? "h " + r + "m" : (h === 1 ? " hr" : " hrs")) : r + "m");
}

/* ---------- build the tiles ---------- */
function buildTiles() {
  var box = $("tiles"), n = wopts.cities.length;
  box.innerHTML = "";
  wopts.cities.forEach(function (c, i) {
    var t = document.createElement("div");
    t.className = "tile";
    t.innerHTML = '<span class="dot" id="dot' + i + '"></span><p class="tile-city"></p><p class="tile-time" id="time' + i + '"></p><p class="tile-note" id="note' + i + '"></p>';
    t.querySelector(".tile-city").textContent = c.label || cityOf(c.tz);
    box.appendChild(t);
  });
  layoutTiles();
}
/* 1-3 cities: one row. 4: 2x2. 5-6: 3 across (2 across on narrow embeds). */
function layoutTiles() {
  var n = wopts.cities.length, narrow = window.innerWidth < 420;
  var wide = window.innerWidth >= 640 && window.innerWidth / window.innerHeight >= 2.25;
  var cols = n <= 3 ? n : n === 4 ? 2 : (narrow ? 2 : 3);
  if (wide) cols = n <= 3 ? n : Math.ceil(n / 2);
  $("tiles").style.gridTemplateColumns = "repeat(" + Math.max(cols, 1) + ", minmax(0, 1fr))";
  $("tiles").hidden = n === 0;
}
window.addEventListener("resize", layoutTiles);

/* ---------- the slider ---------- */
var shift = 0;          // minutes away from now (15-minute steps)
var snapTimer;
$("slide").addEventListener("input", function () {
  shift = +this.value * 15;
  clearTimeout(snapTimer);
  snapTimer = setTimeout(backToNow, 60000);   // drifts back to live after a minute
  render();
});
function backToNow() { shift = 0; $("slide").value = 0; render(); }
$("nowBtn").onclick = backToNow;

/* ---------- draw everything ---------- */
function render() {
  var at = new Date(Date.now() + shift * 60000), htz = homeTz(), hOff = offsetMin(htz, at), hDay = dayKey(htz, at);
  $("homeCity").textContent = homeLabel();
  $("homeTime").innerHTML = timeHTML(htz, at);
  $("homeDate").textContent = at.toLocaleDateString("en-US", { timeZone: htz, weekday: "long", month: "long", day: "numeric" });
  wopts.cities.forEach(function (c, i) {
    if (!$("time" + i)) return;
    $("time" + i).innerHTML = timeHTML(c.tz, at);
    var d = dayKey(c.tz, at), note = diffText(offsetMin(c.tz, at) - hOff);
    if (d > hDay) note = "Tomorrow · " + note; else if (d < hDay) note = "Yesterday · " + note;
    $("note" + i).textContent = note;
    var h = hourIn(c.tz, at);
    $("dot" + i).className = "dot" + (h >= 9 && h < 17 ? " on" : "");
    $("dot" + i).title = h >= 9 && h < 17 ? "Work hours there" : "Outside work hours there";
  });
  var live = shift === 0;
  $("nowBtn").disabled = live;
  $("slideNote").textContent = live ? "Live" : diffText(shift) + " from now";
}

/* add every time zone the browser knows, e.g. "Kolkata (Asia)" */
(function addZones() {
  var have = {};
  PLACES.forEach(function (p) { have[p[0].toLowerCase()] = 1; });
  var zones = Intl.supportedValuesOf ? Intl.supportedValuesOf("timeZone") : [];
  zones.forEach(function (z) {
    var n = cityOf(z); if (have[n.toLowerCase()] || z.indexOf("/") < 0) return;
    PLACES.push([n, z.split("/")[0], z]); have[n.toLowerCase()] = 1;
  });
})();
function plain(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function nowIn(tz) {
  return new Intl.DateTimeFormat("en-US", { timeZone: tz, hour: "numeric", minute: "2-digit", hour12: wopts.hours !== "24" }).format(new Date());
}
function findPlaces(q) {
  q = plain(q.trim()); if (!q) return [];
  var starts = [], has = [];
  PLACES.forEach(function (p) {
    var n = plain(p[0]);
    if (n.indexOf(q) === 0) starts.push(p);
    else if (n.indexOf(q) > 0 || plain(p[1]).indexOf(q) === 0) has.push(p);
  });
  return starts.concat(has).slice(0, 6);
}

/* a search box with a dropdown of matches (arrow keys + Enter work too) */
function searchBox(input, list, onPick) {
  var hits = [], pick = 0;
  function draw() {
    hits = findPlaces(input.value); pick = 0;
    if (!hits.length) {
      list.innerHTML = input.value.trim() ? '<p class="sugg-empty">No matches. Try a nearby big city, a state, or a country.</p>' : "";
      list.hidden = !input.value.trim(); return;
    }
    list.innerHTML = hits.map(function (p, i) {
      return '<button type="button" class="sugg-item' + (i === 0 ? " on" : "") + '" data-i="' + i + '"><span></span><small></small></button>';
    }).join("");
    list.querySelectorAll(".sugg-item").forEach(function (b, i) {
      b.querySelector("span").textContent = hits[i][0];
      b.querySelector("small").textContent = hits[i][1] + " · " + nowIn(hits[i][2]);
      b.onmousedown = function (e) { e.preventDefault(); choose(i); };
    });
    list.hidden = false;
  }
  function choose(i) { var p = hits[i]; if (!p) return; input.value = ""; list.hidden = true; onPick(p); }
  function mark() { list.querySelectorAll(".sugg-item").forEach(function (b, i) { b.classList.toggle("on", i === pick); }); }
  input.addEventListener("input", draw);
  input.addEventListener("focus", function () { if (input.value.trim()) draw(); });
  input.addEventListener("blur", function () { setTimeout(function () { list.hidden = true; }, 120); });
  input.addEventListener("keydown", function (e) {
    if (list.hidden || !hits.length) return;
    if (e.key === "ArrowDown") { e.preventDefault(); pick = Math.min(pick + 1, hits.length - 1); mark(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); pick = Math.max(pick - 1, 0); mark(); }
    else if (e.key === "Enter") { e.preventDefault(); choose(pick); }
    else if (e.key === "Escape") { e.stopPropagation(); list.hidden = true; }
  });
}

function saveWorld() { saveSet("clockin-world", wopts); applyWorld(); }
function applyWorld() {
  document.body.classList.toggle("no-dot", !wopts.dot);
  document.body.classList.toggle("no-slider", !wopts.slider);
  if (!wopts.slider) backToNow();
  buildTiles(); render();
}

$("homeLabel").onchange = function () { wopts.homeLabel = this.value.trim(); saveWorld(); };

/* cities */

  if (wopts.cities.length >= 6) return;
  wopts.cities.push({ label: p[0], tz: p[2] }); saveWorld(); cityRowsHTML();
});
function cityRowsHTML() {
  var box = $("cityRows"); box.innerHTML = "";
  wopts.cities.forEach(function (c, i) {
    var row = document.createElement("div"); row.className = "city-row";
    row.innerHTML = '<div class="city-main"><input class="txt name-in" aria-label="City name"><small></small></div>' +
      '<button class="mini" data-a="up" title="Move up" aria-label="Move up">↑</button>' +
      '<button class="mini" data-a="del" title="Remove" aria-label="Remove">✕</button>';
    row.querySelector(".name-in").value = c.label;
    row.querySelector("small").textContent = cityOf(c.tz) + " time · " + nowIn(c.tz);
    row.querySelector('[data-a="up"]').disabled = i === 0;
    row.querySelector(".name-in").onchange = function () { c.label = this.value.trim() || cityOf(c.tz); saveWorld(); };
    row.querySelector('[data-a="up"]').onclick = function () { wopts.cities.splice(i - 1, 0, wopts.cities.splice(i, 1)[0]); saveWorld(); cityRowsHTML(); };
    row.querySelector('[data-a="del"]').onclick = function () { wopts.cities.splice(i, 1); saveWorld(); cityRowsHTML(); };
    box.appendChild(row);
  });
  var full = wopts.cities.length >= 6;
  $("citySearch").disabled = full;
  $("citySearch").placeholder = full ? "6 cities max. Remove one to add another." : "+ Add a city: start typing…";
}
document.querySelectorAll("#hourSeg button").forEach(function (b) { b.onclick = function () { wopts.hours = b.dataset.v; saveWorld(); syncExtra(); }; });
$("optDot").onchange = function () { wopts.dot = this.checked; saveWorld(); };
$("optSlider").onchange = function () { wopts.slider = this.checked; saveWorld(); };

function syncExtra() {
  $("homeNow").textContent = "Showing: " + homeLabel() + (wopts.homeTz ? "" : " (this device's time zone)");
  $("homeDevice").hidden = !wopts.homeTz;
  $("homeLabel").value = wopts.homeLabel;
  segSelect("hourSeg", wopts.hours);
  $("optDot").checked = wopts.dot; $("optSlider").checked = wopts.slider;
  cityRowsHTML();
}
function resetExtra() { wopts = JSON.parse(JSON.stringify(WORLD_DEFAULT)); saveWorld(); }

applyWorld();
setInterval(render, 1000);
